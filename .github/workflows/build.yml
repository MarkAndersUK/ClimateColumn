name: build

# Two jobs, because this project makes two promises worth checking separately: that it
# builds and passes its tests, and that the physics half of it does so with no network
# and no package sources at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test
    runs-on: windows-latest   # ClimateColumn.Charts targets net8.0-windows (WinForms)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # nuget.config deliberately clears every package source so that a developer's restore
      # never reaches the network - see the comment in that file. A fresh runner has no
      # populated cache, so the source is supplied here instead. Passing it on the command
      # line overrides the cleared sources for this restore only, leaving the committed
      # offline-first configuration untouched.
      - name: Restore
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build -c Release --no-restore

      # The suite is invoked exactly as it is locally. These projects use the MSTest runner
      # (Microsoft.Testing.Platform) rather than VSTest, so `dotnet run` is the entry point
      # and `dotnet test` would not behave the same way.
      #
      # No HITRAN line lists are present on a runner, and that is the point: every test that
      # needs them reports itself inconclusive rather than failing, so a green run here is
      # evidence the no-data path still works. The skip count is printed for that reason.
      - name: Test
        run: dotnet run --project tests/ClimateColumn.Tests -c Release --no-build

      - name: Test the charts
        run: dotnet run --project tests/ClimateColumn.Charts.Tests -c Release --no-build

      # A regression here would be silent otherwise: the headline equilibrium is quoted
      # throughout the README, and nothing else in the suite pins all three numbers together
      # from the outside.
      - name: Check the documented default equilibrium
        shell: pwsh
        run: |
          $out = dotnet run --project src/ClimateColumn.Cli -c Release --no-build
          $text = $out -join "`n"

          $expected = @(
            'surface temperature       :    286.797 K',
            'outgoing longwave (TOA)   :    238.175 W/m2',
            'convecting layer top      :       3.44 km'
          )

          $failed = $false
          foreach ($line in $expected) {
            if ($text -notmatch [regex]::Escape($line)) {
              Write-Host "::error::missing from CLI output: $line"
              $failed = $true
            } else {
              Write-Host "ok: $line"
            }
          }
          if ($failed) {
            Write-Host '--- full output ---'
            Write-Host $text
            exit 1
          }

  docs:
    name: the committed PDF matches its source
    runs-on: ubuntu-latest

    # docs/ClimateColumn-model-description.pdf is generated from docs/model-description.html
    # and committed alongside it, because the PDF is the form most people actually read. That
    # makes it the classic stale-artifact problem: edit the HTML, forget to re-print, and the
    # repository ships a document that disagrees with its own source. Nothing else would
    # notice.
    steps:
      - uses: actions/checkout@v7

      - name: Install a PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Re-print the description from its HTML
        run: |
          chrome=$(command -v google-chrome || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then
            echo "::error::no Chrome or Chromium on the runner to print with"
            exit 1
          fi

          "$chrome" --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf=/tmp/regenerated.pdf \
            "file://$PWD/docs/model-description.html"

          test -s /tmp/regenerated.pdf || { echo "::error::printing produced nothing"; exit 1; }

      # Compared on extracted text with ALL whitespace removed, not byte for byte. Two things
      # would otherwise make this fail for reasons that mean nothing: Chrome stamps a creation
      # time into every PDF it writes, and this runner has none of the Windows fonts the
      # document asks for - so the regenerated file paginates and line-breaks differently while
      # saying exactly the same thing. Stripping whitespace removes wrapping, pagination and
      # the letter-spacing artefacts that extraction sometimes introduces, leaving the
      # characters in order, which is the thing that must not drift.
      - name: Compare it against the committed PDF
        run: |
          # Ligatures are folded back out as well as whitespace. A font that has an "fi" glyph
          # extracts U+FB01 where one without it extracts two characters, and the runner's
          # fallback fonts are not the document's - so without this, "efficiency" could differ
          # from "efficiency" and report a stale PDF that is perfectly current.
          strip() {
            pdftotext -q "$1" - \
              | sed 's/\xef\xac\x80/ff/g; s/\xef\xac\x81/fi/g; s/\xef\xac\x82/fl/g;
                     s/\xef\xac\x83/ffi/g; s/\xef\xac\x84/ffl/g' \
              | tr -d '[:space:]'
          }

          strip docs/ClimateColumn-model-description.pdf > /tmp/committed.txt
          strip /tmp/regenerated.pdf                     > /tmp/fresh.txt

          if [ ! -s /tmp/fresh.txt ]; then
            echo "::error::extracted no text from the regenerated PDF"
            exit 1
          fi

          if cmp -s /tmp/committed.txt /tmp/fresh.txt; then
            echo "ok: the committed PDF is current ($(wc -c < /tmp/fresh.txt) characters)"
            exit 0
          fi

          # Finding the divergence has to cope with one file being a prefix of the other, which
          # is what happens when a section is added or dropped. GNU cmp says "differ: char N"
          # for a substitution but "EOF on ... after byte N" for a truncation, and parsing its
          # prose gets one of those wrong whichever word you match. cmp -l lists the differing
          # positions instead; when it lists none, the files agree up to the shorter one's end
          # and the divergence is exactly there.
          la=$(wc -c < /tmp/committed.txt)
          lb=$(wc -c < /tmp/fresh.txt)
          at=$(cmp -l /tmp/committed.txt /tmp/fresh.txt 2>/dev/null | head -1 | awk '{print $1}')
          [ -n "$at" ] || at=$(( (la < lb ? la : lb) + 1 ))
          from=$(( at > 60 ? at - 60 : 1 ))

          echo "::error::docs/ClimateColumn-model-description.pdf is stale - it does not match docs/model-description.html. Re-print it and commit the result."
          echo "committed: $la characters"
          echo "from HTML: $lb characters"
          echo "first difference at character $at:"
          echo "  committed: ...$(cut -c ${from}-$(( at + 60 )) /tmp/committed.txt)..."
          echo "  from HTML: ...$(cut -c ${from}-$(( at + 60 )) /tmp/fresh.txt)..."
          echo "  committed, as bytes: $(cut -c $(( at > 6 ? at - 6 : 1 ))-$(( at + 6 )) /tmp/committed.txt | od -c | head -2)"
          echo "  from HTML, as bytes: $(cut -c $(( at > 6 ? at - 6 : 1 ))-$(( at + 6 )) /tmp/fresh.txt | od -c | head -2)"
          echo
          echo "regenerate with:"
          echo "  chrome --headless --no-pdf-header-footer \\"
          echo "    --print-to-pdf=docs/ClimateColumn-model-description.pdf \\"
          echo "    docs/model-description.html"
          exit 1

  offline:
    name: offline build, no package sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # The claim being tested: ClimateColumn.Core and ClimateColumn.Cli have no package
      # dependencies at all, so they restore and build from a cold cache with every source
      # cleared. That is what makes the model usable on an air-gapped machine, and it is the
      # kind of property that decays quietly the first time someone adds a convenient
      # dependency. Here restore runs against the committed nuget.config as-is, with no
      # --source override, so adding one would fail this job.
      #
      # Ubuntu also makes this a cross-platform check on the physics, which is
      # framework-only and should not care what it runs on.
      - name: Restore Core and Cli with no sources
        run: |
          dotnet restore src/ClimateColumn.Core
          dotnet restore src/ClimateColumn.Cli

      - name: Build Core and Cli
        run: |
          dotnet build src/ClimateColumn.Core -c Release --no-restore
          dotnet build src/ClimateColumn.Cli -c Release --no-restore

      # Checked with a tolerance rather than by string match, unlike the Windows job. The
      # documented figures were measured on Windows, and Math.Exp and Math.Pow are not
      # guaranteed bit-identical across platforms, so an exact comparison here would fail on a
      # last-digit difference that means nothing. 0.01 K is far tighter than any regression
      # worth catching and far looser than that.
      - name: Run the model on Linux and check it agrees with the documented equilibrium
        run: |
          dotnet run --project src/ClimateColumn.Cli -c Release --no-build | tee out.txt

          check() {
            actual=$(grep -oE "$2" out.txt | head -1 | grep -oE '[0-9]+\.[0-9]+')
            if [ -z "$actual" ]; then
              echo "::error::could not find $1 in the output"
              exit 1
            fi
            if awk -v a="$actual" -v e="$3" -v t="$4" 'BEGIN{d=a-e; if(d<0)d=-d; exit !(d<t)}'; then
              echo "ok: $1 = $actual (expected $3 +/- $4)"
            else
              echo "::error::$1 = $actual, expected $3 +/- $4"
              exit 1
            fi
          }

          check 'surface temperature' 'surface temperature *: *[0-9.]+'   286.797 0.01
          check 'outgoing longwave'   'outgoing longwave \(TOA\) *: *[0-9.]+' 238.175 0.01
          check 'convective top'      'convecting layer top *: *[0-9.]+'  3.44    0.01
